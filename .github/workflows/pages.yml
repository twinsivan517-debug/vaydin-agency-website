# Builds the export, judges it with the ship gate on this runner, and publishes it to GitHub Pages
# on every push to main. Each action is pinned to a commit, not a tag: a moved tag cannot run other
# code here. Dependabot proposes the bumps.
# The ship gate runs HERE since 2026-11-09 (the owner's yes, via web-studio): the laptop's scores
# swung 79 to 90 on unchanged bytes. The deploy job needs the gate step to pass; a gate/** branch
# is measured and never deployed (that is how the floors were set). See scripts/runner-gate.mjs.
name: pages
on:
  push:
    branches: [main, 'gate/**']
  workflow_dispatch:
# The build runs other people's packages: it may only read. Only the deploy
# job, which runs no package code, may publish.
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RUNS: ${{ startsWith(github.ref, 'refs/heads/gate/') && 5 || 3 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Ship gate on this runner (fails closed below the floors)
        run: node scripts/runner-gate.mjs
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
