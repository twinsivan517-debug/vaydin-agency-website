# Builds the export, judges it with the ship gate on this runner, and publishes it to GitHub Pages
# on every push to main. Each action is pinned to a commit, not a tag: a moved tag cannot run other
# code here. Dependabot proposes the bumps.
# The ship gate runs HERE since 2026-11-09 (the owner's yes, via web-studio). It builds a fixed ANCHOR
# commit too and measures both on this one runner, side by side (scripts/runner-gate.mjs says why). The deploy
# job needs it; a gate/** branch is measured and reported, never deployed.
name: pages
on:
  push:
    branches: [main, 'gate/**']
  workflow_dispatch:
# The build runs other people's packages: it may only read. Only the deploy
# job, which runs no package code, may publish.
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RUNS: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build the anchor commit beside the candidate (.github/ship-floors.json; moves only on the owner's word)
        run: |
          anchor=$(node -p "require('./.github/ship-floors.json').anchor")
          echo "anchor commit: $anchor"
          git worktree add ../anchor "$anchor"
          cd ../anchor && npm ci --ignore-scripts && npm run build
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Ship gate on this runner (fails closed)
        env:
          ANCHOR_OUT: ../anchor/out
        run: node scripts/runner-gate.mjs
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
